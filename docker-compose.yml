services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cobraliso
      POSTGRES_USER: cobraliso
      POSTGRES_PASSWORD: senha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: sh -c "npm run db:migrate && npm start"

volumes:
  postgres_data:
